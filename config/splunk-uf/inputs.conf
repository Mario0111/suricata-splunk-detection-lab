# Universal Forwarder input on suricata-01 (10.10.10.30).
# Path: /opt/splunkforwarder/etc/apps/search/local/inputs.conf
# Tails the Suricata EVE log and routes it to a dedicated index with a
# named sourcetype so field extraction and retention stay isolated.

[monitor:///var/log/suricata/eve.json]
disabled = false
index = suricata
sourcetype = suricata:eve
