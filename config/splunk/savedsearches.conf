# COR-001 scheduled correlation search on the indexer (10.10.10.40).
# Path: /opt/splunk/etc/apps/search/local/savedsearches.conf
# Runs every 10 minutes over a rolling 60 minute window and adds a triggered
# alert whenever one source IP has crossed two or more attack stages.
# See detections/COR-001-recon-to-exploit-chain.md

[COR-001 Recon to Exploit Chain]
description = One source IP crossing two or more attack stages. Risk-scored by stage.
enableSched = 1
cron_schedule = */10 * * * *
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 0
display.general.type = statistics
search = index=suricata sourcetype=suricata:eve event_type=alert alert.signature_id>=1000002 alert.signature_id<=1000005\
| eval stage=case('alert.signature_id'==1000005,"1-Reconnaissance",'alert.signature_id'==1000002,"2-Initial Access",'alert.signature_id'==1000004,"3-Discovery",'alert.signature_id'==1000003,"4-Execution")\
| eval risk=case('alert.signature_id'==1000005,20,'alert.signature_id'==1000004,30,'alert.signature_id'==1000002,40,'alert.signature_id'==1000003,50)\
| stats sum(risk) AS risk_score dc(stage) AS stages_observed values(stage) AS attack_stages values(alert.signature) AS detections values(dest_ip) AS targets count AS total_alerts min(_time) AS first_activity max(_time) AS last_activity BY src_ip\
| where stages_observed >= 2\
| eval duration_min=round((last_activity-first_activity)/60,1)\
| eval severity=case(risk_score>=90,"Critical", risk_score>=60,"High", true(),"Medium")\
| convert ctime(first_activity) ctime(last_activity)\
| sort -risk_score\
| table src_ip severity risk_score stages_observed attack_stages detections targets total_alerts duration_min first_activity last_activity
