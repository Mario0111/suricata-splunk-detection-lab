# Dedicated index for Suricata telemetry on the indexer (10.10.10.40).
# Path: /opt/splunk/etc/apps/search/local/indexes.conf
# Isolating IDS data in its own index keeps access control, retention and
# search performance independent of the rest of the SIEM.

[suricata]
homePath   = $SPLUNK_DB/suricata/db
coldPath   = $SPLUNK_DB/suricata/colddb
thawedPath = $SPLUNK_DB/suricata/thaweddb
